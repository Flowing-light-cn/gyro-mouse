plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gyromouse.mouse'
    compileSdk 34

    defaultConfig {
        applicationId "com.gyromouse.mouse"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        debug {
            // 不配置签名，先验证编译；需要安装包时再补签名
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
